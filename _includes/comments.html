{% if page.issueid %}

<div class="wrapper">
 <div id=comments>
   <h2>Comments</h2>
   <div id="commentheader">
      Want to leave a comment?
      Visit <a href="https://github.com/{{site.github_username}}/{{site.repository_name}}/issues/{{page.issueid}}#new_comment_field">this post's issue page on GitHub</a>. A GitHub account is required.
   </div>
  </div>
 </div>

 <script>
   (() => {
     const comments = document.getElementById('comments');
     const endpoint = 'https://api.github.com/repos/{{site.github_username}}/{{site.repository_name}}/issues/{{page.issueid}}/comments';
     const safeUrl = (value) => /^https:\/\//i.test(value || '') ? value : '#';

     fetch(endpoint)
       .then((response) => response.ok ? response.json() : Promise.reject(response))
       .then((data) => data.forEach((comment) => {
         const authorLink = document.createElement('a');
         authorLink.href = safeUrl(comment.user && comment.user.html_url);
         authorLink.target = '_blank';
         authorLink.rel = 'noopener noreferrer';
         const avatar = document.createElement('img');
         avatar.src = safeUrl(comment.user && comment.user.avatar_url);
         avatar.alt = '';
         authorLink.appendChild(avatar);

         const commentLink = document.createElement('a');
         commentLink.href = safeUrl(comment.html_url);
         commentLink.target = '_blank';
         commentLink.rel = 'noopener noreferrer';
         commentLink.textContent = `${comment.user?.login || 'GitHub user'} - ${comment.updated_at || ''}`;

         const body = document.createElement('p');
         body.textContent = comment.body || '';
         comments.append(authorLink, commentLink, body);
       }))
       .catch(() => {});
   })();

</script>

{% endif %}
