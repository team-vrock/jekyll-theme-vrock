{% if site.google-analytics.id and site.google-analytics.id != "" %}
<div id="cookie-notice" role="dialog" aria-live="polite" aria-label="Analytics cookie consent">
    <p>We use Google Analytics only after your approval to understand which posts are useful.</p>
    <p><button id="cookie-notice-accept" class="btn btn-primary btn-sm" type="button">Approve analytics</button>
    <a href="{{ '/privacy' | relative_url }}" class="btn btn-primary btn-sm">More info</a></p>
</div>
<script>
    function createCookie(name, value, days) {
        var expires = "";
        if (days) {
            var date = new Date();
            date.setTime(date.getTime() + (days*24*60*60*1000));
            expires = "; expires=" + date.toUTCString();
        }
        document.cookie = name + "=" + value + expires + "; path=/; SameSite=Lax";
    }
    function readCookie(name) {
        var nameEQ = name + "=";
        var ca = document.cookie.split(';');
        for(var i=0;i < ca.length;i++) {
            var c = ca[i];
            while (c.charAt(0)==' ') c = c.substring(1,c.length);
            if (c.indexOf(nameEQ) == 0) return c.substring(nameEQ.length,c.length);
        }
        return null;
    }
    function eraseCookie(name) {
        createCookie(name,"",-1);
    }

    var consentCookie = '{{ site.google-analytics.cookie_name | default: "cookie-notice-dismissed" }}';
    if(readCookie(consentCookie) == 'true') {
        {% include google-analytics.js %}
    } else {
        document.getElementById('cookie-notice').style.display = 'block';
    }
    document.getElementById('cookie-notice-accept').addEventListener('click', function(e) {
        e.preventDefault();
        createCookie(consentCookie,'true',180);
        document.getElementById('cookie-notice').style.display = 'none';
        location.reload();
    });

</script>
{% endif %}
