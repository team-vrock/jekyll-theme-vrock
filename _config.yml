# Site settings
title: TEAM VROCK
description: "A Jekyll theme for technical teams, company sites, and engineering blogs."

# User settings
username: TEAM VROCK
user_description: "A modern Jekyll theme for teams that publish technical posts and showcase engineering work."
user_title: Technical posts, projects, and engineering notes
hero:
  logo: /assets/img/logo.png
primary_cta:
  label: Read posts
  url: "#searchlist"
secondary_cta:
  label: View projects
  url: "#projects"

navigation:
  - label: About
    url: "#about"
  - label: Projects
    url: "#projects"
  - label: Posts
    url: "#searchlist"

social_links:
  - label: LinkedIn
    url: "https://www.linkedin.com/company/vrock"
    icon: linkedin
  - label: GitHub
    url: "https://github.com/team-vrock"
    icon: github

capabilities:
  - title: Cloud
    icon: cloud
    description: "Cloud platforms, architecture, and operational readiness."
  - title: Transformation
    icon: handshake
    description: "Pragmatic modernization for teams, platforms, and delivery models."
  - title: DevOps
    icon: infinity
    description: "Automation, CI/CD, platform engineering, and reliable delivery."
  - title: Innovation
    icon: lightbulb
    description: "Experiments and technical patterns that move useful ideas forward."
  - title: Agile
    icon: agile
    description: "Iterative delivery, feedback loops, and team enablement."

github_projects:
  organization: team-vrock
  pinned_repositories:
    - jekyll-theme-vrock

# Algolia search settings
algolia:
  enabled: true
  application_id: 'your_application_id'
  index_name: 'your_index_name'
  search_only_api_key: 'your_search_only_api_key'
  powered_by: true

# Google-analytics
google-analytics:
  id: ""
  cookie_name: cookie-notice-dismissed

exclude: ['src', 'node_modules', 'vendor', '.bundle', '.ruby-version', '*.gem']

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge

# Github settings
repository: team-vrock/jekyll-theme-vrock
github: [metadata]
